name: vpn_app
description: "A production-quality Android VPN app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  openvpn_flutter: 2.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  http: ^1.6.0
  country_flags: ^4.1.2
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/servers.json
